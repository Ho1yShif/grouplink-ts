name: CI

on:
  push:
    branches: [main]
    # A rebuild commits only pages, and no check reads them.
    paths-ignore: ['site/**']
  pull_request:

# A rebuild commits pages to main, so cancel the run an older commit started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
